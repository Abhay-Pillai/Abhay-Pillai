<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Professional Portfolio</title>
    <style>
        /* Modern Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* Navigation Bar */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 10%;
            z-index: 1000;
            border-bottom: 1px solid #1e293b;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #38bdf8;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a:hover {
            color: #38bdf8;
            transition: color 0.3s;
        }

        /* Hero Section */
        header {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10%;
            gap: 2rem;
            padding-top: 80px;
        }

        .hero-text h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }

        .hero-text h1 span {
            color: #38bdf8;
        }

        .hero-text h2 {
            font-size: 1.8rem;
            color: #94a3b8;
            margin-bottom: 1.5rem;
            font-weight: 400;
        }

        .cta-btn {
            display: inline-block;
            background: linear-gradient(135deg, #38bdf8, #0369a1);
            color: #fff;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
        }

        .hero-img img {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
        }

        /* Sections General layout */
        section {
            padding: 6rem 10%;
        }

        .section-title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 3rem;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 50px;
            height: 4px;
            background-color: #38bdf8;
            margin: 10px auto 0;
            border-radius: 2px;
        }

        /* Projects Section Grid */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
        }

        .project-card {
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            transition: transform 0.3s;
        }

        .project-card:hover {
            transform: translateY(-5px);
        }

        .project-info {
            padding: 1.5rem;
        }

        .project-info h3 {
            margin-bottom: 0.5rem;
            color: #38bdf8;
        }

        .project-info p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        .project-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tag {
            background-color: #0f172a;
            color: #e2e8f0;
            font-size: 0.8rem;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            border: 1px solid #334155;
        }

        /* Contact Section */
        .contact-container {
            max-width: 600px;
            margin: 0 auto;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        input, textarea {
            width: 100%;
            padding: 1rem;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }

        button[type="submit"] {
            background-color: #38bdf8;
            color: #0f172a;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
        }

        button[type="submit"]:hover {
            background-color: #0ea5e9;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            background-color: #0b0f19;
            border-top: 1px solid #1e293b;
            color: #64748b;
            font-size: 0.9rem;
        }

        /* Responsive Layouts */
        @media (max-width: 768px) {
            nav { padding: 1.2rem 5%; }
            header {
                flex-direction: column-reverse;
                text-align: center;
                justify-content: center;
                padding: 0 5%;
                padding-top: 120px;
            }
            .hero-text h1 { font-size: 2.5rem; }
            .hero-img img { width: 240px; height: 240px; }
            section { padding: 4rem 5%; }
        }
    </style>
</head>
<body>

    <!-- Navigation Menu -->
    <nav>
        <div class="logo">MyPortfolio</div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Home/Hero Section -->
    <header id="home">
        <div class="hero-text">
            <h1>Hi, I am <span>Abhay Pillai</span></h1>
            <h2>Full Stack Developer & Designer</h2>
            <p style="color: #94a3b8; max-width: 500px; margin-bottom: 2rem;">
                I build beautiful, high-performing websites and digital applications. Welcome to my personal space on the internet.
            </p>
            
        </div>
    </header>

    

    

    <!-- Footer Area -->
    <footer>
